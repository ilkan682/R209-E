<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sondage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form action="#" method="POST">

    <!-- Section Pizzas -->
    <fieldset>
        <legend>Votre pizza préférée</legend>
        <p>(un seul choix possible)</p>

        <div class="item_pizza">
            <input type="radio" id="marg" name="pizza">
            <label for="marg">Marguarita</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="napo" name="pizza">
            <label for="napo">Napolitaine</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="reine" name="pizza">
            <label for="reine">Reine</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="calzone" name="pizza">
            <label for="calzone">Calzone</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="fromages" name="pizza">
            <label for="fromages">Trois Fromages</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="texane" name="pizza">
            <label for="texane">Texane</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="mer" name="pizza">
            <label for="mer">Fruits de mer</label>
        </div>
        <div class="item_pizza">
            <input type="radio" id="hawaienne" name="pizza">
            <label for="hawaienne">Hawasenne</label>
        </div>
    </fieldset>

    <!-- Section Fruits -->
    <fieldset>
        <legend>Vos fruits préférés</legend>
        <p>(plusieurs choix possibles)</p>

        <div class="item_fruit">
            <input type="checkbox" id="fraises" value="fraises">
            <label for="fraises">Fraises</label>
        </div>
        <div class="item_fruit">
            <input type="checkbox" id="framboises" value="framboises">
            <label for="framboises">Framboises</label>
        </div>
        <div class="item_fruit">
            <input type="checkbox" id="myrtilles" value="myrtilles">
            <label for="myrtilles">Myrtilles</label>
        </div>
        <div class="item_fruit">
            <input type="checkbox" id="peches" value="peches">
            <label for="peches">Paches</label>
        </div>
        <div class="item_fruit">
            <input type="checkbox" id="abricots" value="abricots">
            <label for="abricots">Abricots</label>
        </div>
        <div class="item_fruit">
            <input type="checkbox" id="poires" value="poires">
            <label for="poires">Poires</label>
        </div>
        <div class="item_fruit">
            <input type="checkbox" id="pommes" value="pommes">
            <label for="pommes">Pommes</label>
        </div>
    </fieldset>

    <br>
    <input type="submit" value="Envoyer">

</form>

</body>
</html>
