<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter des données</title>
</head>
<body>
    <!-- Remplacement de l'action par la balise dynamique de Django pour l'ajout -->
    <form method="post" action="{% url 'ajout' %}">
        {% csrf_token %}
        {{ form.as_ul }}
        <input type="submit" value="Envoyer les données">
    </form>
</body>
</html>
